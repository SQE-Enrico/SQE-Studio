[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqe-studio-product-foundation"
version = "0.1.1.dev81"
description = "SQE Studio: revisioned quantum EDA orchestration platform (product foundation)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
scqubits = ["scqubits==4.3.1"]
quantum-metal = ["quantum-metal>=0.8,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "setuptools==80.9.0", "wheel==0.45.1", "numpy==2.2.6", "scipy==1.17.1"]
browser = ["playwright>=1.55,<2"]

[project.scripts]
sqe-studio = "sqe_studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqe_studio = ["web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/modules/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
