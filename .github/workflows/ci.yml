name: SQE software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
    defaults:
      run:
        working-directory: SQE-Studio
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SQE_CI_OS: ${{ matrix.os }}
      SQE_CI_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test GitHub report rendering
        run: python -m unittest discover -s ../.github/scripts -p "test_*.py" -v
      - name: Install software test tools
        run: python -m pip install -e ".[dev,browser]"
      - name: Install real browser
        run: python -m playwright install --with-deps chromium
      - name: Verify, test all domains, exercise browser and isolated wheel
        run: python tools/dev.py --check --profile software
      - name: Check Python syntax
        run: python -m compileall -q src/sqe_studio tools
      - name: Record upstream metadata
        run: python tools/upstream_inventory_probe.py
      - name: Preserve current test reports on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: software-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            SQE-Studio/qualification-reports/*.zip
            SQE-Studio/qualification-reports/local-latest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish readable test summary
        if: always()
        run: python ../.github/scripts/ci_summary.py --root .
