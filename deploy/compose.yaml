name: sqe-studio
x-studio: &studio
  image: sqe-studio:0.3.0
  build:
    context: ..
    dockerfile: ${SQE_DOCKERFILE:-deploy/Dockerfile}
  environment: &environment
    SQE_DATA: /data
    SQE_ORIGIN: https://${SQE_HOST:?Set SQE_HOST in deploy/studio.env}
    SQE_DEVELOPMENT: '0'
    SQE_MAX_JOBS: ${SQE_MAX_JOBS:-2}
    SQE_TOTAL_CPUS: ${SQE_TOTAL_CPUS:-8}
    SQE_MEMORY_GB: ${SQE_MEMORY_GB:-16}
    SQE_MAX_CAPSULE_MB: ${SQE_MAX_CAPSULE_MB:-512}
    SQE_MAX_EXPANDED_MB: ${SQE_MAX_EXPANDED_MB:-8192}
  volumes:
    - studio_data:/data
  read_only: true
  tmpfs:
    - /tmp:size=1g
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  web:
    <<: *studio
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz',headers={'Host':os.environ['SQE_ORIGIN'].split('//')[1]}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *studio
    command: ['python', '-m', 'sqw.studio.jobs']
    stop_grace_period: 30s
  proxy:
    image: caddy:2
    environment:
      SQE_HOST: ${SQE_HOST}
      SQE_MAX_CAPSULE_MB: ${SQE_MAX_CAPSULE_MB:-512}
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  studio_data:
  caddy_data:
  caddy_config:
