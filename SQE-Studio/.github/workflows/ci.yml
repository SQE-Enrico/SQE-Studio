name: SQE Product Foundation CI
on:
  push:
  pull_request:
jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
      - run: python -m compileall -q src/sqe_studio tools/delta.py
      - run: python tools/verify_release_source.py . # extended product inventory; delta.py verify is baseline-only
      - run: python -m build --wheel
      - name: Inspect wheel UX assets
        run: python -c "import zipfile,glob;z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]);assert all(any(n.endswith(x) for n in z.namelist()) for x in ('web/index.html','web/app.js','web/style.css'))"
