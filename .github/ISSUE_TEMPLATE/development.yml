name: Development increment
description: Feature or fix with verifiable acceptance criteria and test profiles.
title: "[Development] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the observable behavior and owning area.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add measurable checklist items.
      placeholder: |
        - [ ] Positive workflow verified
        - [ ] Errors, provenance and stale revisions verified
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
      description: List focused tests, Automatic Test profiles and native/fixture evidence.
      value: "Recommended; software before integration; the relevant native profile."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and dependencies
      description: Link PRs, reports, upstream examples and prerequisite issues. Declare blockers.
